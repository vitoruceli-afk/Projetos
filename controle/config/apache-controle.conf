# ============================================================================
# VirtualHost Apache (httpd) - controle.cepemar.com
#
# No servidor: /etc/httpd/conf.d/sites-available/controle.conf
# (link simbólico em sites-enabled/). Requer o pacote mod_ssl.
#   apachectl configtest && systemctl reload httpd
#
# Sem HSTS enquanto o certificado for autoassinado: com HSTS o navegador
# não permite ao usuário prosseguir após o aviso de certificado.
# ============================================================================

# HTTP -> redireciona tudo para HTTPS
<VirtualHost *:80>
    ServerName controle.cepemar.com
    ServerAlias www.controle.cepemar.com

    Redirect permanent / https://controle.cepemar.com/

    ErrorLog /var/log/httpd/controle.cepemar.com-error.log
    CustomLog /var/log/httpd/controle.cepemar.com-access.log combined
</VirtualHost>

# HTTPS
<VirtualHost *:443>
    ServerName controle.cepemar.com
    ServerAlias www.controle.cepemar.com
    DocumentRoot /var/www/html/controle

    <Directory /var/www/html/controle>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/cepemar.crt
    SSLCertificateKeyFile /etc/pki/tls/private/cepemar.key
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1

    ErrorLog /var/log/httpd/controle.cepemar.com-ssl-error.log
    CustomLog /var/log/httpd/controle.cepemar.com-ssl-access.log combined
</VirtualHost>
