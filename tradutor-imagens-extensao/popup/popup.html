<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tradutor de Imagens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="brand">
        <span class="brand-icon" aria-hidden="true">🌐</span>
        <h1>Tradutor de Imagens</h1>
      </header>

      <label class="field">
        <span class="label">Idioma de destino</span>
        <select id="target-language" aria-describedby="target-hint"></select>
      </label>
      <p id="target-hint" class="sr-only">Idioma em que o texto será traduzido.</p>

      <div class="actions" role="group" aria-label="Ações de tradução">
        <button class="action" id="btn-image" type="button">
          <span class="action-icon" aria-hidden="true">🖼</span>
          <span class="action-text">
            <strong>Traduzir imagem</strong>
            <small>Clique em uma imagem da página</small>
          </span>
          <kbd>Ctrl+Shift+I</kbd>
        </button>
        <button class="action" id="btn-area" type="button">
          <span class="action-icon" aria-hidden="true">✂</span>
          <span class="action-text">
            <strong>Selecionar área</strong>
            <small>Desenhe um retângulo na tela</small>
          </span>
          <kbd>Ctrl+Shift+T</kbd>
        </button>
        <button class="action" id="btn-page" type="button" aria-pressed="false">
          <span class="action-icon" aria-hidden="true">🌐</span>
          <span class="action-text">
            <strong id="page-label">Traduzir página inteira</strong>
            <small>Textos e imagens com texto</small>
          </span>
        </button>
      </div>

      <div
        id="dropzone"
        class="dropzone"
        tabindex="0"
        role="button"
        aria-label="Enviar uma imagem do computador para tradução"
      >
        <span aria-hidden="true">⬆</span>
        <span>Arraste uma imagem aqui ou <u>escolha um arquivo</u></span>
        <input id="file" type="file" accept="image/*" hidden />
      </div>

      <section class="toggles" aria-label="Opções">
        <label class="toggle"
          ><input id="opt-auto" type="checkbox" /> Detectar idioma automaticamente</label
        >
        <label class="toggle"
          ><input id="opt-overlay" type="checkbox" /> Mostrar tradução sobre a imagem</label
        >
        <label class="toggle"
          ><input id="opt-format" type="checkbox" /> Manter formatação original</label
        >
        <label class="toggle"
          ><input id="opt-hover" type="checkbox" /> Botão "Traduzir" ao passar o mouse</label
        >
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <footer class="footer">
        <ul class="badges" aria-label="Situação dos serviços">
          <li><span class="dot ok" aria-hidden="true"></span> OCR local disponível</li>
          <li id="badge-translation"><span class="dot" aria-hidden="true"></span> <span id="badge-text">Verificando…</span></li>
        </ul>
        <nav class="links" aria-label="Atalhos">
          <button id="link-settings" type="button">⚙ Configurações</button>
          <button id="link-history" type="button">📜 Histórico</button>
        </nav>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
